name: Main CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets a run be triggered by hand on a fork branch before upstream Actions
  # are enabled for it (a fork's push/pull_request triggers stay dormant
  # until a maintainer approves the fork's Actions) - template-drift.yml
  # already has this for the same reason.
  workflow_dispatch:

# Every job here only reads the repo: nothing pushes, comments, or releases.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    # package.json's engines field (engine-strict via .npmrc) says >=24.14.0,
    # not >=25 - mirrors gears-frontx's own [24.14.x, 25.x] matrix so the
    # floor is actually exercised, not just declared.
    strategy:
      matrix:
        node-version: [24.14.x, 25.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        # policy:version-bump-on-change needs a merge base with the PR's
        # target branch, and a shallow (depth-1) checkout has no history to
        # compute one from.
        fetch-depth: 0

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: npm ci

    - name: Run scripts test suite
      run: npm test

    # Prepublish manifest + content self-containment validation (`frontx
    # validate`) against every template at the repo root (a directory
    # carrying `frontx-template.json`, ADR-0018 - not a `template-*` name
    # guess). `@gears-frontx/cli` comes from the registry (a devDependency
    # here), not a local build, so this needs no build step first.
    - name: Validate template manifests (prepublish, content self-containment)
      run: npm run validate:templates

    # Every pinned ecosystem package (@gears-frontx/api, mfes, gts-plugin,
    # ...) at an exact registry version must actually exist on the registry.
    # Registry mode (no FRONTX_ECOSYSTEM_DIR here) - see README.md and
    # scripts/template-ecosystem-packages.mjs for the sibling-checkout mode
    # this same script also runs in, from template-drift.yml's own pin-drift
    # step (which has a gears-frontx checkout on disk to point it at).
    - name: Check template ecosystem pin-drift
      run: npm run policy:template-pin-drift

    # #575's gate, moved here with the templates: a governed root
    # (template-shell itself, or a template-shell/packages/* workspace
    # member) whose src/ or package.json dependencies changed must also bump
    # its own version, in the same PR. Pull-request-only: the merge base it
    # needs is the PR's base branch, only present as GITHUB_BASE_REF on
    # pull_request events.
    - name: Check version bump on substantive template change
      if: github.event_name == 'pull_request'
      run: npm run policy:version-bump-on-change

    # #524: npm reconciling an out-of-sync template lockfile drops the
    # template's file:. self-link entry, writing a lockfile its own `npm ci`
    # then rejects. This asserts every self-link a template declares still
    # has its lockfile entry.
    - name: Check template lockfile self-link entries
      run: npm run policy:template-lockfile-selflink

    # Template design tokens are full CSS colors consumed as var(--x), never
    # shadcn-style HSL fragments consumed as hsl(var(--x)).
    - name: Check template token format (full-color vocabulary)
      run: npm run policy:token-format

    # ADR-0003's confirmation section promises CI confirms both halves of the
    # mfe-runtime-public-surface boundary. The barrel half (packages/mfes/src/
    # index.ts must not export a concrete Default* implementation) is checked
    # in gears-frontx, where that package still lives. This is the consumer
    # half moved here with the templates: no file under any template may
    # import a concrete implementation name from @gears-frontx/mfes, or
    # deep-import a subpath past its barrel.
    - name: Check template mfes import boundary (ADR-0003)
      run: npm run policy:template-mfes-import-boundary

    # A .gitignore a template ships lands in every seeded project: none may
    # ignore a path any template puts into a project: its payload at the target
    # frontx-composition.json names, its AI bundle, or the ground its
    # excludedSubtrees reserve for a nested template (the
    # shell's once hid every MFE package `frontx add` brought in). Unlike the
    # other policy guards (findGuardedTemplateDirs), it finds templates by
    # manifest presence (findTemplateDirs): a template without a manifest
    # cannot be seeded, so it ships no .gitignore into a project.
    - name: Check seeded .gitignore keeps template ground tracked
      run: npm run policy:seeded-gitignore

  # template-dashboard has no frontx-template.json yet, so template-validate
  # and the seeded .gitignore check do not see it. The other policy guards
  # above still walk it: it is listed in PRE_MANIFEST_TEMPLATE_DIRS
  # (scripts/template-discovery.mjs) until its manifest lands. Its two
  # packages (src-app/mfe_packages/{dashboard,widgets}) are type-checked and
  # tested through the template's own dev harness.
  dashboard-template:
    name: Dashboard Template Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-dashboard

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '25.x'
        cache: 'npm'
        cache-dependency-path: template-dashboard/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run type-check

    - name: Unit and component tests
      run: npm test

    # Each widget type is its own Module Federation bundle, built with the
    # FrontX manifest pipeline of template-shell/src/build; the dev host is
    # built without any widget code and loads the bundles at runtime.
    - name: Build the widget bundles
      run: npm run build:widgets

    - name: Build the dev host
      run: npm run build:host

  # Architecture documents of the catalogue (architecture/) and of each
  # template (<template>/architecture): ids, PRD to DESIGN coverage and
  # references, validated the way gears-frontx validates its own. The
  # registry (.cf-studio/config/artifacts.toml) lets each template choose its
  # own slug and register its own code paths, registers no code for the
  # catalogue, and shares no ids with gears-frontx - see the comment at its
  # top for the rules.
  studio-validate:
    name: Studio Validate Artifacts
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # The Constructor Studio release is pinned in .cf-studio/version.toml;
    # read it once for both the CLI install and the runtime it materializes.
    - name: Read pinned Constructor Studio version
      id: cfs-version
      run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open(".cf-studio/version.toml", "rb"))["cfs"]["version"])')" >> "$GITHUB_OUTPUT"

    - name: Install Constructor Studio CLI
      run: pipx install "git+https://github.com/constructorfabric/studio.git@${{ steps.cfs-version.outputs.version }}"

    # .cf-studio/.core is gitignored (Constructor-Studio-owned, regenerated
    # on demand) - materialize it before invoking studio.py directly. cfs
    # resolves the pinned tag and downloads it through api.github.com; it
    # sends GITHUB_TOKEN when set, so the call is not held to the anonymous
    # per-IP rate limit that shared runners exhaust.
    - name: Bootstrap Constructor Studio runtime
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: cfs update -y --no-interactive --with-kits yes --version ${{ steps.cfs-version.outputs.version }}

    - name: Validate artifacts and traceability
      run: python3 .cf-studio/.core/skills/studio/scripts/studio.py validate

  studio-validate-kits:
    name: Studio Validate Kits
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Read pinned Constructor Studio version
      id: cfs-version
      run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open(".cf-studio/version.toml", "rb"))["cfs"]["version"])')" >> "$GITHUB_OUTPUT"

    - name: Install Constructor Studio CLI
      run: pipx install "git+https://github.com/constructorfabric/studio.git@${{ steps.cfs-version.outputs.version }}"

    - name: Bootstrap Constructor Studio runtime
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: cfs update -y --no-interactive --with-kits yes --version ${{ steps.cfs-version.outputs.version }}

    - name: Validate installed kits
      run: python3 .cf-studio/.core/skills/studio/scripts/studio.py validate-kits

  # template-shell carries its own arch:deps / lint / test:unit scripts, and
  # nothing else in this workflow enters it - so without this job its checks
  # are enforced only when someone runs them by hand, and they rot (#483).
  #
  # Two kinds of template, both need covering:
  #   - self-contained (template-shell): root package.json and lockfile of
  #     its own, validated standalone by the glob loop below, which
  #     deliberately avoids hardcoding template names;
  #   - overlay (template-mfe, template-design-guardrails): no root
  #     package.json, no tooling of its own. It cannot be validated in place -
  #     its packages' vite/vitest configs import out of the shell at the
  #     target it is applied to. The only way to run its checks is to compose
  #     the batch the way `frontx apply` does and validate the result, which
  #     the second step does.
  template-validate:
    name: Template Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '25.x'
        cache: 'npm'
        cache-dependency-path: |
          template-*/package-lock.json

    - name: Enable Corepack
      run: corepack enable

    # Split the templates by shape: one carrying a root package.json owns its
    # own toolchain and is validated standalone; one without is an overlay,
    # meaningful only composed onto a shell at the target
    # frontx-composition.json gives it.
    - name: Classify templates
      run: |
        set -euo pipefail
        node -e '
          const fs = require("fs");
          const selfContained = [], overlays = [];
          for (const dir of fs.readdirSync(".").filter((d) => d.startsWith("template-")).sort()) {
            if (!fs.existsSync(dir + "/frontx-template.json")) continue;
            (fs.existsSync(dir + "/package.json") ? selfContained : overlays).push(dir);
          }
          if (!selfContained.length) throw new Error("no self-contained template found");
          console.log("self-contained: " + selfContained.join(" "));
          console.log("overlays: " + (overlays.join(" ") || "(none)"));
          fs.appendFileSync(process.env.GITHUB_ENV,
            `SELF_CONTAINED_TEMPLATES=${selfContained.join(" ")}\n` +
            `OVERLAY_TEMPLATES=${overlays.join(" ")}\n`);
        '

    # Both template steps below run their installs from a copy placed OUTSIDE
    # the checkout, so no ancestor node_modules (this job installs none at the
    # repo root at all) can supply what a template's own lockfile fails to
    # install - the same graph a standalone `frontx seed` gets outside this
    # repo entirely.
    - name: Validate self-contained templates
      run: |
        set -euo pipefail
        for template in $SELF_CONTAINED_TEMPLATES; do
          echo "==> Validating $template"
          isolated="$RUNNER_TEMP/standalone-$(basename "$template")"
          rm -rf "$isolated" && mkdir -p "$isolated"
          tar -C "$template" --exclude=node_modules -cf - . | tar -C "$isolated" -xf -
          (
            cd "$isolated"
            npm ci
            npm run build
            npm run type-check
            npm run arch:deps
            npm run lint
            npm run test:unit
          )
        done

    # Composes every template at the target frontx-composition.json names -
    # the tree `frontx apply` produces for that batch - and runs the shell's
    # checks over it. scripts/compose-templates.mjs is the one layout rule,
    # shared with the local dev loop (`npm run compose:templates`). Every pin
    # the composed tree carries is a real published registry version, so this
    # is a plain `npm install` with nothing rewritten first.
    - name: Validate the composed templates
      run: |
        set -euo pipefail

        if [ -z "${OVERLAY_TEMPLATES// /}" ]; then
          echo "::error::no overlay templates found - this step would be a no-op"
          exit 1
        fi

        composed="$RUNNER_TEMP/composed"
        node scripts/compose-templates.mjs --out "$composed"

        cd "$composed"
        # npm install, not npm ci: the shell's committed lockfile is generated
        # without the overlay, so it has no mfe_packages entries and `ci`
        # would fail as out of sync.
        npm install

        # The design-guardrails template keeps its canonical DESIGN.md in its
        # AI bundle; a project's root DESIGN.md is the project's own file,
        # created once from that copy (init writes only when absent) and then
        # checked: its token names and kit version against the kit this shell
        # pins, now installed. A kit bump in the shell fails here until the
        # canonical DESIGN.md names its tokens and its version. Exit 1
        # (findings) and 2 (input error) both fail the step under `set -e`.
        case " $OVERLAY_TEMPLATES " in
          *" template-design-guardrails "*)
            node .frontx/ai/@gears-frontx/template-design-guardrails/skills/frontx-design/scripts/init-design-md.mjs
            node .frontx/ai/@gears-frontx/template-design-guardrails/skills/frontx-design/scripts/check-design-md.mjs
            ;;
        esac

        # FRONTX_INCLUDE_TEMPLATE_EXAMPLES=1 on both commands below, because
        # every MFE package this job composes is one the template ships as an
        # example and declares "templateExample": true. Without the opt-in the
        # package scanners skip all of them and this job — the only CI path
        # that compiles the overlaid MFEs at all — passes having compiled
        # nothing.
        FRONTX_INCLUDE_TEMPLATE_EXAMPLES=1 npm run build
        FRONTX_INCLUDE_TEMPLATE_EXAMPLES=1 npm run type-check
        npm run arch:deps
        npm run lint
        npm run test:unit
