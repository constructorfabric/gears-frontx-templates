# template-dashboard: ids cpt-frontx-dashboard-*. Lists its documents explicitly
# and registers its own code path.
[[systems]]
name = "template-dashboard"
slug = "frontx-dashboard"
kit = "sdlc"
artifacts_dir = "template-dashboard/architecture"
artifacts = [
  { name = "FrontX Dashboard Template PRD", path = "template-dashboard/architecture/PRD.md", kind = "PRD", traceability = "DOCS-ONLY" },
  { name = "FrontX Dashboard Template DESIGN", path = "template-dashboard/architecture/DESIGN.md", kind = "DESIGN", traceability = "DOCS-ONLY" },
  { name = "FrontX Dashboard Template DECOMPOSITION", path = "template-dashboard/architecture/DECOMPOSITION.md", kind = "DECOMPOSITION", traceability = "DOCS-ONLY" },
  { name = "ADR-0001: Frontend framework", path = "template-dashboard/architecture/ADR/0001-frontend-framework-v1.md", kind = "ADR", traceability = "DOCS-ONLY" },
  { name = "ADR-0002: Dashboard layout grid", path = "template-dashboard/architecture/ADR/0002-dashboard-layout-grid-v1.md", kind = "ADR", traceability = "DOCS-ONLY" },
  { name = "ADR-0003: Shared data types and schemas", path = "template-dashboard/architecture/ADR/0003-shared-data-types-and-schemas-v1.md", kind = "ADR", traceability = "DOCS-ONLY" },
  { name = "ADR-0004: Charting library", path = "template-dashboard/architecture/ADR/0004-charting-library-v1.md", kind = "ADR", traceability = "DOCS-ONLY" },
  { name = "ADR-0005: Data grid library", path = "template-dashboard/architecture/ADR/0005-data-grid-library-v1.md", kind = "ADR", traceability = "DOCS-ONLY" },
  { name = "ADR-0006: Theme distribution", path = "template-dashboard/architecture/ADR/0006-theme-distribution-v1.md", kind = "ADR", traceability = "DOCS-ONLY" },
  { name = "ADR-0007: Extension domain, action and the larger view", path = "template-dashboard/architecture/ADR/0007-extension-domain-taxonomy-v1.md", kind = "ADR", traceability = "DOCS-ONLY" },
  { name = "ADR-0008: Widget type and entry trait", path = "template-dashboard/architecture/ADR/0008-widget-type-and-mfe-realization-v1.md", kind = "ADR", traceability = "DOCS-ONLY" },
  { name = "ADR-0009: Subject-agnostic widget catalog", path = "template-dashboard/architecture/ADR/0009-subject-agnostic-widget-catalog-v1.md", kind = "ADR", traceability = "DOCS-ONLY" },
  { name = "ADR-0010: Template packages and host contract", path = "template-dashboard/architecture/ADR/0010-template-packages-and-host-contract-v1.md", kind = "ADR", traceability = "DOCS-ONLY" },
  { name = "ADR-0011: Widget data binding", path = "template-dashboard/architecture/ADR/0011-widget-data-binding-v1.md", kind = "ADR", traceability = "DOCS-ONLY" },
  { name = "feature-dashboard-model", path = "template-dashboard/architecture/features/feature-dashboard-model/FEATURE.md", kind = "FEATURE", traceability = "DOCS-ONLY" },
  { name = "feature-dashboard-runtime", path = "template-dashboard/architecture/features/feature-dashboard-runtime/FEATURE.md", kind = "FEATURE", traceability = "DOCS-ONLY" },
  { name = "feature-widget-contract", path = "template-dashboard/architecture/features/feature-widget-contract/FEATURE.md", kind = "FEATURE", traceability = "DOCS-ONLY" },
  { name = "feature-widget-catalog", path = "template-dashboard/architecture/features/feature-widget-catalog/FEATURE.md", kind = "FEATURE", traceability = "DOCS-ONLY" },
]

[[systems.codebase]]
path = "template-dashboard/src-app"
extensions = [".ts", ".tsx"]
