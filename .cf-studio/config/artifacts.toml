# Studio artifacts registry
#
# The catalogue root system, slug templates and ids cpt-templates-*,
# describes this repository as a collection of the FrontX templates. Every
# template, a top-level directory with a frontx-template.json manifest,
# registers its own system over <template>/architecture. Registration is by
# hand: a template that brings its documents adds its [[systems]] block
# here, and a template directory without one is simply not validated.
# Auto-discovered child systems would take the parent's prefix
# (cpt-<parent>-<child>-*), so templates are not auto-discovered.
#
# A template's system slug, and with it its id prefix cpt-<slug>-*, is the
# template's own choice. template-<name> is one valid choice, the one the
# three blocks below use; frontx-<name> is another (template-dashboard uses
# frontx-dashboard). The slug must be unique in this registry and must not
# reproduce a gears-frontx prefix, so that its ids cannot be mistaken for
# ecosystem ids: not frontx itself, not frontx-<child> for a gears-frontx
# child system (frontx-routing, frontx-ui-kit and the like, whose ids are
# cpt-frontx-<child>-*), and cpt-<slug>- must not begin any existing
# gears-frontx id.
#
# This repository shares no id namespace with gears-frontx. The gears-frontx
# ids are internal to it and may change without notice, so a document here
# never carries a backticked gears-frontx id (a cpt-frontx-* id outside the
# prefixes registered here); it cites the decision as plain text, such as
# FrontX ADR-0033, or as a link to the file on develop. Both the prefix and
# the citation rule are checked in review, because cfs v1.6.2 neither ties
# a prefix to its owning system (any registered prefix passes in any
# document) nor flags a backticked cpt-frontx-* reference; both silently
# pass. Sources: the registry spec
# .cf-studio/.core/architecture/specs/artifacts-registry.md (Autodetect
# section) and the engine's longest-prefix match over all registered
# systems in .cf-studio/.core/skills/studio/scripts/studio/commands/validate.py,
# line 173.
#
# A system may find its documents by autodetect, as the blocks below do, or
# list them explicitly in artifacts = [...] (template-dashboard lists its
# documents); both are accepted. Neither form reports a document that is not
# there: autodetect with required = false simply finds nothing, and a listed
# path that does not exist is skipped without an error, so a listed file
# that goes missing is caught in review, not by cfs. Every kind below is
# `required = false` because none of the registered directories holds
# documents yet. The PR that brings a template's PRD and DESIGN sets those
# two kinds of its system to `required = true`.
#
# The catalogue registers no code. A template's system may register the
# template's own code paths ([[systems.codebase]] under its block), so that
# the @cpt- markers there trace to that template's own documents; cfs does
# not report a registered code path that does not exist, so review checks
# the paths. The three template blocks below register none, because they
# have no documents yet for a marker to trace to. ADR-0033 of gears-frontx
# only rules that markers in template code bind nothing to gears-frontx
# artifacts
# (https://github.com/constructorfabric/gears-frontx/blob/develop/architecture/ADR/0033-template-territory-traceability.md).

# The catalogue: ids cpt-templates-*.
[[systems]]
name = "FrontX Templates catalogue"
slug = "templates"
kit = "sdlc"
artifacts_dir = "architecture"

[[systems.autodetect]]
kit = "sdlc"
system_root = "{project_root}"
artifacts_root = "architecture"

[systems.autodetect.artifacts]
[systems.autodetect.artifacts.PRD]
pattern = "PRD.md"
traceability = "DOCS-ONLY"
required = false

[systems.autodetect.artifacts.DESIGN]
pattern = "DESIGN.md"
traceability = "DOCS-ONLY"
required = false

[systems.autodetect.artifacts.DECOMPOSITION]
pattern = "DECOMPOSITION.md"
traceability = "DOCS-ONLY"
required = false

[systems.autodetect.artifacts.ADR]
pattern = "ADR/**/*.md"
traceability = "DOCS-ONLY"
required = false

[systems.autodetect.artifacts.FEATURE]
pattern = "features/*/FEATURE.md"
traceability = "DOCS-ONLY"
required = false

